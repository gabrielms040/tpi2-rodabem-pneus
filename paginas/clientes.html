<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - RodaBem Pneus</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <a class="marca" href="../index.html">RodaBem Pneus</a>
            <span class="subtitulo">Sistema administrativo da loja</span>
        </div>
        <div class="faixa"></div>
    </header>

    <main class="container">
        <nav class="navegacao">
            <a href="../index.html">Voltar para o início</a>
            <a href="clientes.html" class="atual">Clientes</a>
            <a href="veiculos.html">Veículos</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="pneus.html">Pneus</a>
            <a href="vendas.html">Vendas</a>
        </nav>

        <h1>Cadastro de cliente</h1>
        <p class="descricao">O cliente precisa ter 18 anos ou mais. O CPF é conferido pelos dígitos verificadores.</p>

        <form id="form-cliente" class="formulario" novalidate>
            <div class="campos">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" maxlength="100">
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
                </div>
                <div class="campo">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento">
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" placeholder="(34) 99999-9999">
                </div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" maxlength="60">
                </div>
            </div>
            <div class="acoes">
                <button type="submit" class="botao-principal">Salvar cliente</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>

        <div id="resultado" class="resultado"></div>
    </main>

    <script src="../js/comum.js"></script>
    <script src="../js/clientes.js"></script>
</body>
</html>
