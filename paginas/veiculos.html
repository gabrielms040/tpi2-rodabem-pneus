<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos - RodaBem Pneus</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <header class="topo">
        <div class="topo-conteudo">
            <a class="marca" href="../index.html">RodaBem Pneus</a>
            <span class="subtitulo">Sistema administrativo da loja</span>
        </div>
        <div class="faixa"></div>
    </header>

    <main class="container">
        <nav class="navegacao">
            <a href="../index.html">Voltar para o início</a>
            <a href="clientes.html">Clientes</a>
            <a href="veiculos.html" class="atual">Veículos</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="pneus.html">Pneus</a>
            <a href="vendas.html">Vendas</a>
        </nav>

        <h1>Cadastro de veículo</h1>
        <p class="descricao">Guarda o carro do cliente e a medida do pneu original, para facilitar a próxima troca.</p>

        <form id="form-veiculo" class="formulario" novalidate>
            <div class="campos">
                <div class="campo">
                    <label for="cpf_dono">CPF do dono</label>
                    <input type="text" id="cpf_dono" name="cpf_dono" placeholder="000.000.000-00">
                </div>
                <div class="campo">
                    <label for="placa">Placa</label>
                    <input type="text" id="placa" name="placa" maxlength="8" placeholder="ABC1D23">
                </div>
                <div class="campo">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca" placeholder="Ex.: Volkswagen">
                </div>
                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" name="modelo" placeholder="Ex.: Gol 1.0">
                </div>
                <div class="campo">
                    <label for="ano">Ano</label>
                    <input type="number" id="ano" name="ano" min="1950" max="2100">
                </div>
                <div class="campo">
                    <label for="medida_pneu">Medida do pneu</label>
                    <input type="text" id="medida_pneu" name="medida_pneu" placeholder="175/70R14">
                    <small>Está escrita na lateral do pneu.</small>
                </div>
            </div>
            <div class="acoes">
                <button type="submit" class="botao-principal">Salvar veículo</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>

        <div id="resultado" class="resultado"></div>
    </main>

    <script src="../js/comum.js"></script>
    <script src="../js/veiculos.js"></script>
</body>
</html>
